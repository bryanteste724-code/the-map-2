name: Build THE MAP

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Android 64-bit
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64
          build-config: Release

      - name: Upload THE MAP
        uses: actions/upload-artifact@v4
        with:
          name: THE-MAP-android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
