name: Build THE MAP

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - Android32
          - Android64

    name: Build ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v7

      - name: Build THE MAP
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: ${{ matrix.target }}
          combine: true
          build-config: Release

  package:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Combine Android builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Upload THE MAP
        uses: actions/upload-artifact@v7
        with:
          name: THE-MAP-Android32-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
