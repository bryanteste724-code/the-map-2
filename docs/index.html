<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE MAP | Official</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #071321;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    padding: 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0c1d30;
    border-bottom: 1px solid #24415b;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 3px;
}

nav a {
    color: #b9d9f5;
    text-decoration: none;
    margin-left: 15px;
    font-size: 13px;
}

.hero {
    min-height: 550px;
    padding: 100px 20px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background:
      radial-gradient(ellipse at 50% 80%, #155c91 0%, transparent 60%),
      linear-gradient(160deg, #102c48, #071321 75%);
}

.hero h1 {
    font-size: clamp(48px, 10vw, 85px);
    margin: 0;
    letter-spacing: 5px;
    text-shadow: 0 0 30px #48aaff;
}

.hero p {
    color: #b9d9f5;
    font-size: 17px;
    margin: 20px 0 35px;
}

.download {
    display: inline-block;
    padding: 17px 35px;
    border-radius: 10px;
    background: #1678c5;
    color: white;
    text-decoration: none;
    font-weight: bold;
    letter-spacing: 1px;
}

.download:hover {
    background: #2999ed;
}

section {
    padding: 65px 20px;
    text-align: center;
}

section h2 {
    font-size: 30px;
}

section p {
    color: #a9bfd3;
    line-height: 1.7;
    max-width: 550px;
    margin: 15px auto;
}

footer {
    padding: 25px;
    text-align: center;
    color: #7894ad;
    border-top: 1px solid #24415b;
    font-size: 13px;
}

</style>
</head>

<body>

<header>
    <div class="logo">THE MAP</div>
    <nav>
        <a href="#about">ABOUT</a>
        <a href="#download">DOWNLOAD</a>
    </nav>
</header>

<main>
    <div class="hero">
        <h1>THE MAP</h1>
        <p>Explore the unknown.</p>
        <a class="download" href="#download">
            DISCOVER THE MOD
        </a>
    </div>

    <section id="about">
        <h2>About THE MAP</h2>
        <p>
            A custom map experience for Geometry Dash,
            created to explore a different side of the game.
        </p>
    </section>

    <section id="download">
        <h2>Download</h2>
        <p>
            THE MAP download will be available here soon.
        </p>
    </section>
</main>

<footer>
    THE MAP © 2026 — Unofficial Geometry Dash mod.
</footer>

</body>
</html>
